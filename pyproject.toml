[project]
name = "stokowski"
version = "0.4.0"
description = "Orchestration semantics for autonomous coding agents"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sugar & Coffee", email = "josh@sugarandcoffee.co.uk" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Sugar-Coffee/stokowski"
Repository = "https://github.com/Sugar-Coffee/stokowski"

[tool.setuptools.packages.find]
include = ["stokowski*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
