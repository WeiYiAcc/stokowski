# =============================================================================
# Stokowski — 半自动流水线模板（Linear tracker，含人工 gate）
# =============================================================================
# 这是模板。要使用：
#   1. cp workflow.linear-half-auto.yaml workflow.yaml
#   2. cp prompts_linear-half-auto/*.md prompts/
#   3. 编辑 workflow.yaml：填上 your-org/your-target-repo 真实路径
#                        + your-linear-project-slug 真实 slug
#                        + 确认 LINEAR_API_KEY 在 env / .env
#   4. stokowski workflow.yaml
#
# 用途: 复杂或高风险改动，每个关键节点暂停等人工审核后再继续
#
# 与 linear-full-auto 的差异:
#   - 多 2 个 gate state: research-review (investigate 后) +
#     implementation-review (implement 后)
#   - gate 期间 Linear issue 状态会变成 "Human Review"
#   - 人工切到 "Gate Approved" 触发下一阶段；切到 "Rework" 回退重做
#   - max_rework 限制每个 gate 的返工次数
#
# 使用流程（拷贝到 workflow.yaml 后）:
#   1. 在 Linear 创建 issue (Backlog)
#   2. 状态改 Todo，stokowski 拾取 → investigate state
#   3. investigate 完成后状态自动变 Human Review
#   4. 你 review 后切 Gate Approved → implement state
#   5. implement 完成 → 又一次 Human Review → 切 Gate Approved → code-review
#   6. code-review 通过 → Done

tracker:
  kind: linear
  project_slug: "your-linear-project-slug"
  api_key: $LINEAR_API_KEY

linear_states:
  todo: "Todo"
  active: "In Progress"
  review: "Human Review"
  gate_approved: "Gate Approved"
  rework: "Rework"
  terminal:
    - Done
    - Closed
    - Canceled
    - Duplicate

polling:
  interval_ms: 15000

workspace:
  root: ~/agent-state/stokowski-workspaces/half-auto

# =============================================================================
# TARGET_REPO 占位符 — 复制到 workflow.yaml 后必须替换
# 详见 workflow.linear-full-auto.yaml 同位置的注释。
# =============================================================================

hooks:
  after_create: |
    set -euo pipefail
    WS_PATH="$(pwd -P)"
    WS_NAME="stokowski-$(basename "$WS_PATH")"
    TARGET_REPO="$HOME/ghq/github.com/your-org/your-target-repo"
    cd "$TARGET_REPO"
    if [ -d ".jj" ]; then
      jj workspace add "$WS_PATH" --name "$WS_NAME"
      echo "[after_create] jj workspace $WS_NAME created at $WS_PATH"
    else
      rmdir "$WS_PATH"
      DEFAULT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "main")
      git worktree add -B "$WS_NAME" "$WS_PATH" "$DEFAULT_BRANCH"
      echo "[after_create] git worktree created at $WS_PATH (branch=$WS_NAME from $DEFAULT_BRANCH)"
    fi

  before_remove: |
    set -euo pipefail
    WS_PATH="$(pwd -P)"
    WS_NAME="stokowski-$(basename "$WS_PATH")"
    TARGET_REPO="$HOME/ghq/github.com/your-org/your-target-repo"
    mkdir -p "$HOME/agent-state/stokowski-results/half-auto/"
    cp -r . "$HOME/agent-state/stokowski-results/half-auto/$(basename "$WS_PATH")/" 2>/dev/null || true
    cd "$TARGET_REPO"
    if [ -d ".jj" ]; then
      jj workspace forget "$WS_NAME" 2>/dev/null || true
      echo "[before_remove] detached jj workspace $WS_NAME"
    else
      git worktree remove --force "$WS_PATH" 2>/dev/null || true
      echo "[before_remove] removed git worktree at $WS_PATH (branch $WS_NAME kept for review)"
    fi

  timeout_ms: 120000

claude:
  permission_mode: auto
  model: claude-sonnet-4-6
  max_turns: 20
  turn_timeout_ms: 3600000
  stall_timeout_ms: 300000

agent:
  max_concurrent_agents: 3
  max_concurrent_agents_by_state:
    code-review: 1   # 串行 review 防 merge 冲突
  max_retry_backoff_ms: 300000

prompts:
  global_prompt: prompts/global.md

# 半自动：investigate → research-review (gate) → implement → implementation-review (gate) → code-review → done
states:
  investigate:
    type: agent
    prompt: prompts/investigate.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 8
    session: inherit
    transitions:
      complete: research-review

  research-review:
    type: gate
    linear_state: review
    rework_to: investigate
    max_rework: 3
    transitions:
      approve: implement

  implement:
    type: agent
    prompt: prompts/implement.md
    linear_state: active
    model: claude-sonnet-4-6
    max_turns: 40
    session: inherit
    transitions:
      complete: implementation-review

  implementation-review:
    type: gate
    linear_state: review
    rework_to: implement
    max_rework: 5
    transitions:
      approve: code-review

  code-review:
    type: agent
    prompt: prompts/review.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 10
    session: fresh
    transitions:
      complete: done

  done:
    type: terminal
    linear_state: terminal
