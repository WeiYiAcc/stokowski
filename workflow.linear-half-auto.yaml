# =============================================================================
# Stokowski — 半自动流水线模板（Linear tracker，含人工 gate）
# =============================================================================
# 这是模板。要使用：
#   1. cp workflow.linear-half-auto.yaml workflow.yaml
#   2. cp prompts_linear-half-auto/*.md prompts/
#   3. 编辑 workflow.yaml：填上 your-org/your-target-repo 真实路径
#                        + your-linear-project-slug 真实 slug
#                        + 确认 LINEAR_API_KEY 在 env / .env
#   4. 通过 Multica runner 调用 stokowski 编排语义
#
# 用途: 复杂或高风险改动，每个关键节点暂停等人工审核后再继续
#
# 与 linear-full-auto 的差异:
#   - 多 2 个 gate state: research-review (investigate 后) +
#     implementation-review (implement 后)
#   - gate 期间 Linear issue 状态会变成 "Human Review"
#   - 人工切到 "Gate Approved" 触发下一阶段；切到 "Rework" 回退重做
#   - max_rework 限制每个 gate 的返工次数

tracker:
  kind: linear
  project_slug: "your-linear-project-slug"
  api_key: $LINEAR_API_KEY

linear_states:
  todo: "Todo"
  active: "In Progress"
  review: "Human Review"
  gate_approved: "Gate Approved"
  rework: "Rework"
  terminal:
    - Done
    - Closed
    - Canceled
    - Duplicate

polling:
  interval_ms: 15000

claude:
  permission_mode: auto
  model: claude-sonnet-4-6
  max_turns: 20
  turn_timeout_ms: 3600000
  stall_timeout_ms: 300000

agent:
  max_concurrent_agents: 3
  max_concurrent_agents_by_state:
    code-review: 1   # 串行 review 防 merge 冲突
  max_retry_backoff_ms: 300000

prompts:
  global_prompt: prompts/global.md

# 半自动：investigate → research-review (gate) → implement → implementation-review (gate) → code-review → done
states:
  investigate:
    type: agent
    prompt: prompts/investigate.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 8
    session: inherit
    transitions:
      complete: research-review

  research-review:
    type: gate
    linear_state: review
    rework_to: investigate
    max_rework: 3
    transitions:
      approve: implement

  implement:
    type: agent
    prompt: prompts/implement.md
    linear_state: active
    model: claude-sonnet-4-6
    max_turns: 40
    session: inherit
    transitions:
      complete: implementation-review

  implementation-review:
    type: gate
    linear_state: review
    rework_to: implement
    max_rework: 5
    transitions:
      approve: code-review

  code-review:
    type: agent
    prompt: prompts/review.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 10
    session: fresh
    transitions:
      complete: done

  done:
    type: terminal
    linear_state: terminal
