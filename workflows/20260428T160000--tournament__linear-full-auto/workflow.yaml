# =============================================================================
# Stokowski — 全自动流水线（无 gate，无人值守）
# =============================================================================
# Linear project: stokowski-auto (df340bedf106)
# 用途: 手机发任务，全自动跑完，Linear 只作日志
# 启动: stokowski workflow-auto.yaml

tracker:
  kind: linear
  project_slug: "df340bedf106"
  api_key: $LINEAR_API_KEY

linear_states:
  todo: "Todo"
  active: "In Progress"
  review: "Human Review"
  gate_approved: "Gate Approved"
  rework: "Rework"
  terminal:
    - Done
    - Closed
    - Canceled
    - Duplicate

polling:
  interval_ms: 15000

workspace:
  root: ~/agent-state/stokowski-workspaces/auto

hooks:
  # after_create: turn the empty workspace dir into a jj workspace of the
  # target repo, so the agent edits an isolated working copy that shares
  # the underlying jj/git history. This way:
  #   - 3 issues can run in parallel without working-copy conflicts
  #   - The agent's commits are visible in the main repo's `jj log`
  #   - Roll-back is per-ticket (just `jj workspace forget`)
  #   - The user can keep working in the main workspace concurrently
  #
  # NOTE: hard-coded to ariadne-fact for now. To support multiple repos,
  # encode the target repo in the Linear ticket description and parse it
  # in this hook (future work).
  after_create: |
    set -euo pipefail
    WS_PATH="$(pwd -P)"
    WS_NAME="stokowski-$(basename "$WS_PATH")"
    TARGET_REPO="$HOME/ghq/github.com/WeiYiAcc/ariadne-fact"
    cd "$TARGET_REPO"
    # `jj workspace add` accepts an empty existing dir; populates it with
    # working-copy files and adds it to `jj workspace list`.
    jj workspace add "$WS_PATH" --name "$WS_NAME"
    echo "[after_create] jj workspace $WS_NAME created at $WS_PATH"

  # before_remove: archive the workspace's final state and detach the jj
  # workspace before stokowski rmtree's the dir. The actual jj objects
  # (commits) stay in the main repo's .jj — only the working copy is
  # detached.
  before_remove: |
    set -euo pipefail
    WS_PATH="$(pwd -P)"
    WS_NAME="stokowski-$(basename "$WS_PATH")"
    TARGET_REPO="$HOME/ghq/github.com/WeiYiAcc/ariadne-fact"
    # Archive working-copy state for forensics.
    mkdir -p "$HOME/agent-state/stokowski-results/auto/"
    cp -r . "$HOME/agent-state/stokowski-results/auto/$(basename "$WS_PATH")/" 2>/dev/null || true
    # Detach jj workspace (commits remain in main repo).
    cd "$TARGET_REPO"
    jj workspace forget "$WS_NAME" 2>/dev/null || true
    echo "[before_remove] detached jj workspace $WS_NAME"

  timeout_ms: 120000

claude:
  permission_mode: auto
  model: claude-sonnet-4-6
  max_turns: 20
  turn_timeout_ms: 3600000
  stall_timeout_ms: 300000

agent:
  max_concurrent_agents: 3
  max_retry_backoff_ms: 300000

prompts:
  global_prompt: global.md

# 全自动：investigate → implement → code-review(fresh) → done
states:
  investigate:
    type: agent
    prompt: investigate.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 8
    session: inherit
    transitions:
      complete: implement

  implement:
    type: agent
    prompt: implement.md
    linear_state: active
    model: claude-sonnet-4-6
    max_turns: 40
    session: inherit
    transitions:
      complete: code-review

  code-review:
    type: agent
    prompt: review.md
    linear_state: active
    model: claude-opus-4-6
    max_turns: 10
    session: fresh
    transitions:
      complete: done

  done:
    type: terminal
    linear_state: terminal
